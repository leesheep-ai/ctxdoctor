[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxdoctor"
version = "0.1.0"
description = "Audit coding agent instruction files and detect context drift."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
ctxdoctor = "ctxdoctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
